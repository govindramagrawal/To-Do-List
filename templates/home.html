{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}?v=2">
</head>
<body>
    <div class = "parent_box">
        {% include 'navbar.html' %}
        <div class = "task_box">
            <h1>All Tasks</h1>
            <table border = "4">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Done</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                    <tr>
                        <td>{{ task.title }}</td>
                        <td>{{ task.description }}</td>
                        <td>
                            <form method="POST" action="{% url 'toggle_done' task.id %}">
                                {% csrf_token %}
                                <input type="checkbox" name="done" {% if task.done %}checked{% endif %} onchange="this.form.submit()">
                            </form>
                        </td>
                        <td>{{ task.created }}</td>
                        <td>
                            <a class="edit_btn" href="{% url 'edit_task' task.id %}">Edit</a> |
                            <a class="delete_btn" href="{% url 'delete_task' task.id %}">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" style="padding-left: 30px; padding-top: 10px; background-color: #fafafc;">No tasks available.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
